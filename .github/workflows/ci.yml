name: CI

on:
  push:
    branches: [main, dev, "**"]
  pull_request:
    branches: [main, dev, "**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config ripgrep

      - name: Check formatting
        run: cargo fmt --check --all

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

  windows-runtime:
    name: Windows native runtime acceptance
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-runtime

      - name: Clippy
        run: cargo clippy --workspace --locked -- -D warnings

      - name: Native Windows runtime and IPC tests
        run: cargo test --workspace --locked

      - name: Native Windows release build
        run: cargo build --release -p nca-cli --locked

      - name: CLI process smoke test
        run: .\target\release\nca.exe --help
