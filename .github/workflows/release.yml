name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts without creating a GitHub Release"
        type: boolean
        default: true

# Tag pushes (v*) and manual dispatch build Windows / Linux / macOS binaries.
# GitHub Releases are created only for pushed vMAJOR.MINOR.PATCH tags. Manual
# dispatch is always a build-only dry run, regardless of the input value.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: nca

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.release-context.outputs.should_publish }}
      version: ${{ steps.release-context.outputs.version }}
    steps:
      - name: Validate release context
        id: release-context
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual dispatch is build-only (dry_run=${DRY_RUN:-true}); no GitHub Release will be created."
            {
              echo "should_publish=false"
              echo "version="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" != "push" || "$REF" != refs/tags/* ]]; then
            echo "This workflow execution is not a release tag; artifacts will not be published."
            {
              echo "should_publish=false"
              echo "version="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="${REF#refs/tags/}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag '$tag'; expected vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi

          echo "Validated release tag: $tag"
          {
            echo "should_publish=true"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"

  ci-check:
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config ripgrep

      - name: Check formatting
        run: cargo fmt --check --all

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Test
        run: cargo test --workspace

  build:
    needs: ci-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p nca-cli

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          BIN="${{ env.BINARY_NAME }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE="${{ matrix.archive }}"
          EXT=""
          case "$TARGET" in
            *windows*) EXT=".exe" ;;
          esac

          cd "target/${TARGET}/release"
          if [[ ! -f "${BIN}${EXT}" ]]; then
            echo "missing binary: ${BIN}${EXT}" >&2
            ls -la
            exit 1
          fi

          OUT="../../../${BIN}-${TARGET}.${ARCHIVE}"
          if [[ "$ARCHIVE" == "zip" ]]; then
            if command -v 7z >/dev/null 2>&1; then
              7z a -tzip "$OUT" "${BIN}${EXT}"
            else
              # Windows runners ship bsdtar, which can write zip archives.
              tar -a -c -f "$OUT" "${BIN}${EXT}"
            fi
          else
            tar czf "$OUT" "${BIN}${EXT}"
          fi
          cd ../../..
          ls -lh "${BIN}-${TARGET}.${ARCHIVE}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: ${{ env.BINARY_NAME }}-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: [validate-release, ci-check, build]
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.validate-release.result == 'success' &&
      needs.validate-release.outputs.should_publish == 'true' &&
      needs.ci-check.result == 'success' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-install-script:
    needs: [validate-release, release]
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.validate-release.result == 'success' &&
      needs.validate-release.outputs.should_publish == 'true' &&
      needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        env:
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
        run: echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update install script version
        run: |
          if [[ "$(uname)" == "Darwin" ]]; then
            sed -i '' "s/^VERSION=.*/VERSION=\"${{ steps.version.outputs.version }}\"/" install.sh
          else
            sed -i "s/^VERSION=.*/VERSION=\"${{ steps.version.outputs.version }}\"/" install.sh
          fi

      - name: Commit updated install script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add install.sh
          git diff --staged --quiet || git commit -m "chore: bump install script to v${{ steps.version.outputs.version }}"
          git push origin HEAD:main
